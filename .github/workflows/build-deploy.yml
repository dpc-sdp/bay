name: build-deploy-bay-images
run-name: Build and deploy Bay images
on:
  pull_request:
    types: 
      - closed
      - opened
      - synchronize
  issue_comment:
    types:
      - created
  schedule:
    - cron: '23 20 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
jobs:
  buildx:
    if: |
      github.event.pull_request.merged == true || 
      contains(fromJson('["schedule", "workflow_dispatch"]'), github.event_name) || 
      (github.event_name == 'pull_request' && startsWith(github.head_ref,'build/')) ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/build'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        images: ${{ fromJson(vars.IMAGES) }}
        # While PHP_PATCH_VERSION is set, php images are built by the
        # php-patch-* jobs below instead.
        exclude:
          - images: ${{ vars.PHP_PATCH_VERSION != '' && 'php-cli' || 'none' }}
          - images: ${{ vars.PHP_PATCH_VERSION != '' && 'php-fpm' || 'none' }}
    steps:
      - name: Get PR branch
        if: github.event.issue.pull_request
        id: pr-branch
        uses: xt0rted/pull-request-comment-branch@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/checkout@v4
        if: |
          github.event.pull_request.merged == true || 
          contains(fromJson('["schedule", "workflow_dispatch"]'), github.event_name) || 
          (github.event_name == 'pull_request' && startsWith(github.head_ref,'build/'))

      - uses: actions/checkout@v4
        if: ( github.event.issue.pull_request && contains(github.event.comment.body, '/build') )
        with:
          ref: ${{ steps.pr-branch.outputs.head_ref }}

      - name: Login to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.images }}
          context: ${{ github.event.issue.pull_request && 'workflow' || 'git' }}
          tags: |
            # PR images (not merged): pr-<num>
            type=ref,event=pr,enable=${{ github.event.pull_request.merged == false }}
            # Tag with the PR base branch name on merge
            type=raw,value=${{ github.event.pull_request.base.ref }},enable=${{ github.event.pull_request.merged == true }}
            # Manual/scheduled runs tag by branch ref
            type=ref,event=branch,enable=${{ contains(fromJson('["schedule", "workflow_dispatch"]'), github.event_name) }}
            # Comment-triggered builds: pr-<num>
            type=raw,value=pr-${{ github.event.issue.number }},enable=${{ github.event.issue.pull_request != null }}
            # Supported release branches - use the fetched branch name for comments
            type=raw,value=5.x,enable=${{ (github.ref_name == '5.x' || github.event.pull_request.base.ref == '5.x') && ! steps.pr-branch.outputs.head_ref }}
            type=raw,value=6.x,enable=${{ (github.ref_name == '6.x' || github.event.pull_request.base.ref == '6.x') && ! steps.pr-branch.outputs.head_ref }}
            type=raw,value=7.x,enable=${{ (github.ref_name == '7.x' || github.event.pull_request.base.ref == '7.x') && ! steps.pr-branch.outputs.head_ref }}
            # Always add an immutable sha tag
            type=raw,value=sha-${{ github.event.pull_request.head.sha || steps.pr-branch.outputs.head_sha || github.sha }}
          labels: |
            maintainer=Victorian Department of Government Services
            repository=${{ github.repositoryUrl }}
            org.opencontainers.image.authors=Victorian Department of Government Services
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/tree/${{ (contains(fromJson('["opened","synchronize"]'), github.event.action)) && github.head_ref || github.event.action == 'closed' && github.base_ref || github.ref_name }}/images/${{ matrix.images }}/Dockerfile
            org.opencontainers.image.title=${{ matrix.images }}
            org.opencontainers.image.description=${{ matrix.images }} image for Bay container platform

      - name: Create the AWX-EE context
        if: matrix.images == 'awx-ee'
        run: |
          pip install --upgrade ansible-builder
          ansible-builder create \
            --output-filename Dockerfile \
            --verbosity 3
        working-directory: ./images/awx-ee

      - name: Upload AWX-EE context for review
        if: matrix.images == 'awx-ee'
        uses: actions/upload-artifact@v4
        with:
          name: awx-ee-context
          path: ./images/awx-ee/context
          retention-days: 1

      - name: Build and push the images
        uses: docker/bake-action@v5
        with:
          push: true
          source: .
          files: |
            ./gh-actions-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          # Target the default group - probably unnecessary.
          targets: ${{ matrix.images }}

  # Emergency PHP patching: when the PHP_PATCH_VERSION repository variable is
  # set (e.g. 8.3.36), php-cli / php-fpm are built on the Lagoon PHP image
  # chain rebuilt from uselagoon/lagoon-images with that php base, instead of
  # uselagoon/*:latest. Unset it once Lagoon releases the fix. See
  # lagoon-php-patch.hcl.
  #
  # Each platform builds on a native runner (the Lagoon chain compiles PHP
  # extensions, which is very slow under QEMU) and is pushed by digest;
  # php-patch-merge then publishes the multi-platform tags.
  php-patch-build:
    if: |
      vars.PHP_PATCH_VERSION != '' && (
      github.event.pull_request.merged == true || 
      contains(fromJson('["schedule", "workflow_dispatch"]'), github.event_name) || 
      (github.event_name == 'pull_request' && startsWith(github.head_ref,'build/')) ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/build'))
      )
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      matrix:
        images: [php-cli, php-fpm]
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Get PR branch
        if: github.event.issue.pull_request
        id: pr-branch
        uses: xt0rted/pull-request-comment-branch@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/checkout@v4
        if: |
          github.event.pull_request.merged == true || 
          contains(fromJson('["schedule", "workflow_dispatch"]'), github.event_name) || 
          (github.event_name == 'pull_request' && startsWith(github.head_ref,'build/'))

      - uses: actions/checkout@v4
        if: ( github.event.issue.pull_request && contains(github.event.comment.body, '/build') )
        with:
          ref: ${{ steps.pr-branch.outputs.head_ref }}

      - name: Login to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.images }}
          context: ${{ github.event.issue.pull_request && 'workflow' || 'git' }}
          tags: |
            # PR images (not merged): pr-<num>
            type=ref,event=pr,enable=${{ github.event.pull_request.merged == false }}
            # Tag with the PR base branch name on merge
            type=raw,value=${{ github.event.pull_request.base.ref }},enable=${{ github.event.pull_request.merged == true }}
            # Manual/scheduled runs tag by branch ref
            type=ref,event=branch,enable=${{ contains(fromJson('["schedule", "workflow_dispatch"]'), github.event_name) }}
            # Comment-triggered builds: pr-<num>
            type=raw,value=pr-${{ github.event.issue.number }},enable=${{ github.event.issue.pull_request != null }}
            # Supported release branches - use the fetched branch name for comments
            type=raw,value=5.x,enable=${{ (github.ref_name == '5.x' || github.event.pull_request.base.ref == '5.x') && ! steps.pr-branch.outputs.head_ref }}
            type=raw,value=6.x,enable=${{ (github.ref_name == '6.x' || github.event.pull_request.base.ref == '6.x') && ! steps.pr-branch.outputs.head_ref }}
            type=raw,value=7.x,enable=${{ (github.ref_name == '7.x' || github.event.pull_request.base.ref == '7.x') && ! steps.pr-branch.outputs.head_ref }}
            # Always add an immutable sha tag
            type=raw,value=sha-${{ github.event.pull_request.head.sha || steps.pr-branch.outputs.head_sha || github.sha }}
          labels: |
            maintainer=Victorian Department of Government Services
            repository=${{ github.repositoryUrl }}
            org.opencontainers.image.authors=Victorian Department of Government Services
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/tree/${{ (contains(fromJson('["opened","synchronize"]'), github.event.action)) && github.head_ref || github.event.action == 'closed' && github.base_ref || github.ref_name }}/images/${{ matrix.images }}/Dockerfile
            org.opencontainers.image.title=${{ matrix.images }}
            org.opencontainers.image.description=${{ matrix.images }} image for Bay container platform

      - name: Prepare PHP patch overlay
        id: php-patch
        env:
          PHP_PATCH_VERSION: ${{ vars.PHP_PATCH_VERSION }}
          LAGOON_IMAGES_REF: ${{ vars.LAGOON_IMAGES_REF }}
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/lagoon-php-patch.sh prepare

      - name: Verify PHP patch build
        if: steps.php-patch.outputs.enabled == 'true'
        env:
          PHP_PATCH_VERSION: ${{ vars.PHP_PATCH_VERSION }}
          LAGOON_VERSION: ${{ steps.php-patch.outputs.lagoon_ref }}
          IMAGE: ${{ matrix.images }}
          PLATFORM: ${{ matrix.arch.platform }}
        run: |
          docker buildx bake -f gh-actions-bake.hcl -f lagoon-images/docker-bake.hcl -f lagoon-php-patch.hcl \
            --set "*.platform=${PLATFORM}" --set "${IMAGE}.tags=bay-verify/${IMAGE}:candidate" --load "$IMAGE"
          ./.github/scripts/lagoon-php-patch.sh verify "${REGISTRY}/${GITHUB_REPOSITORY}/${IMAGE}:6.x" "bay-verify/${IMAGE}:candidate"

      - name: Build and push by digest
        id: bake
        uses: docker/bake-action@v5
        env:
          PHP_PATCH_VERSION: ${{ vars.PHP_PATCH_VERSION }}
          LAGOON_VERSION: ${{ steps.php-patch.outputs.lagoon_ref }}
        with:
          source: .
          files: |
            ./gh-actions-bake.hcl
            ${{ steps.php-patch.outputs.enabled == 'true' && './lagoon-images/docker-bake.hcl' || '' }}
            ${{ steps.php-patch.outputs.enabled == 'true' && './lagoon-php-patch.hcl' || '' }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.images }}
          set: |
            *.platform=${{ matrix.arch.platform }}
            ${{ matrix.images }}.tags=
            ${{ matrix.images }}.output=type=image,"name=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.images }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          IMAGE: ${{ matrix.images }}
        run: |
          digest="$(jq -r --arg t "$IMAGE" '.[$t]["containerimage.digest"]' <<<"$METADATA")"
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::No digest in bake metadata for $IMAGE"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.images }}-${{ matrix.arch.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  php-patch-merge:
    needs: php-patch-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        images: [php-cli, php-fpm]
    steps:
      - name: Get PR branch
        if: github.event.issue.pull_request
        id: pr-branch
        uses: xt0rted/pull-request-comment-branch@v3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.images }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.images }}
          context: ${{ github.event.issue.pull_request && 'workflow' || 'git' }}
          tags: |
            # PR images (not merged): pr-<num>
            type=ref,event=pr,enable=${{ github.event.pull_request.merged == false }}
            # Tag with the PR base branch name on merge
            type=raw,value=${{ github.event.pull_request.base.ref }},enable=${{ github.event.pull_request.merged == true }}
            # Manual/scheduled runs tag by branch ref
            type=ref,event=branch,enable=${{ contains(fromJson('["schedule", "workflow_dispatch"]'), github.event_name) }}
            # Comment-triggered builds: pr-<num>
            type=raw,value=pr-${{ github.event.issue.number }},enable=${{ github.event.issue.pull_request != null }}
            # Supported release branches - use the fetched branch name for comments
            type=raw,value=5.x,enable=${{ (github.ref_name == '5.x' || github.event.pull_request.base.ref == '5.x') && ! steps.pr-branch.outputs.head_ref }}
            type=raw,value=6.x,enable=${{ (github.ref_name == '6.x' || github.event.pull_request.base.ref == '6.x') && ! steps.pr-branch.outputs.head_ref }}
            type=raw,value=7.x,enable=${{ (github.ref_name == '7.x' || github.event.pull_request.base.ref == '7.x') && ! steps.pr-branch.outputs.head_ref }}
            # Always add an immutable sha tag
            type=raw,value=sha-${{ github.event.pull_request.head.sha || steps.pr-branch.outputs.head_sha || github.sha }}
          labels: |
            maintainer=Victorian Department of Government Services
            repository=${{ github.repositoryUrl }}
            org.opencontainers.image.authors=Victorian Department of Government Services
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/tree/${{ (contains(fromJson('["opened","synchronize"]'), github.event.action)) && github.head_ref || github.event.action == 'closed' && github.base_ref || github.ref_name }}/images/${{ matrix.images }}/Dockerfile
            org.opencontainers.image.title=${{ matrix.images }}
            org.opencontainers.image.description=${{ matrix.images }} image for Bay container platform

      - name: Create and push multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.images }}
        run: |
          count="$(find . -type f | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected 2 platform digests, found $count"
            exit 1
          fi
          # shellcheck disable=SC2046 # word splitting is intended
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image
        env:
          PHP_PATCH_VERSION: ${{ vars.PHP_PATCH_VERSION }}
        run: |
          ref="$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$ref"
          echo "$ref runs PHP $(docker run --rm --entrypoint php "$ref" -n -r 'echo PHP_VERSION;') (PHP_PATCH_VERSION=${PHP_PATCH_VERSION})"
