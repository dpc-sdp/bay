name: Merge 6.x into 7.x

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 23 * * 0'  # Run every Sunday at 11 PM UTC (Monday 9 AM AEST)

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: 6.x

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"


      - name: Create a pull request from sync branch to 7.x
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: 7.x
          branch: temp-sync-branch
          title: "Sync changes from 6.x"
          body: |
            This pull request syncs relevant changes from the `6.x` branch into the `7.x` branch.
            
            This PR was automatically generated by the CI workflow.
          labels: sync, automated
          draft: false
          sign-commits: true


      - name: Send Slack notification
        id: notify_slack
        uses: slackapi/slack-github-action@v2.1.1
        if: steps.create-pr.outputs.exitcode > 0
        env:
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.event.repository.html_url }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SDP_PLATFORM_SLACK_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "GitHub Action - ${{ github.action }} failed. \n${{ env.LINK }}"
