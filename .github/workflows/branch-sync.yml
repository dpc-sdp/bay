name: Merge 6.x into 7.x

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 23 * * 0'  # Run every Sunday at 11 PM UTC (Monday 9 AM AEST)

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare sync branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin

          # Create a new sync branch from 7.x (target)
          git checkout -b temp-sync-branch origin/7.x

          HAD_CONFLICTS=false

          # Merge 6.x into temp branch, preferring 7.x on conflicts
          if ! git merge --no-ff -X ours origin/6.x -m "Sync 6.x into 7.x (prefer 7.x on conflicts)"; then
            echo "Merge reported conflicts; force-resolving all to 7.x (ours)..."
            HAD_CONFLICTS=true
            # Accept 'ours' version for all remaining conflicts
            git checkout --ours .
            git add -A
            git commit -m "Sync 6.x into 7.x (auto-resolved conflicts preferring 7.x)"
          fi

          # If the merge results in no net change, don't open a PR
          if git diff --quiet origin/7.x..HEAD; then
            echo "NO_CHANGES=true" >> "${GITHUB_ENV}"
          fi

          if $HAD_CONFLICTS; then
            echo "HAD_CONFLICTS=true" >> "${GITHUB_ENV}"
          fi

      - name: Create a pull request from sync branch to 7.x
        if: env.NO_CHANGES != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: 7.x
          branch: temp-sync-branch
          title: "Sync changes from 6.x"
          body: |
            This pull request syncs relevant changes from the `6.x` branch into the `7.x` branch.

            - Merge performed with `-X ours` to prefer `7.x` on conflicts.
            - Any remaining conflicts were auto-resolved to `ours` to keep CI green; reviewers can adjust in this PR if needed.
            - Non-conflicting changes from `6.x` are preserved.

            This PR was automatically generated by the CI workflow.
          labels: ${{ env.HAD_CONFLICTS == 'true' && 'sync, automated, merge-conflicts-resolved' || 'sync, automated' }}
          draft: false
          sign-commits: true

      - name: Enable auto-merge
        if: env.NO_CHANGES != 'true'
        run: |
          gh pr merge temp-sync-branch --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
