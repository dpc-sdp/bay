name: Merge 6.x into 7.x

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 23 * * 0'  # Run every Sunday at 11 PM UTC (Monday 9 AM AEST)

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare sync branch
        shell: bash
        run: |
          set -euo pipefail

          # Fetch all branches
          git fetch origin

          # Create a new sync branch from 7.x (target)
          git checkout -b temp-sync-branch origin/7.x

          # Collect 6.x commits not on 7.x (oldest first), excluding "sync: skip"
          mapfile -t COMMITS < <(git log --reverse --pretty=format:'%H %s' origin/7.x..origin/6.x | grep -v -E 'sync:\s*skip' || true)

          if [ ${#COMMITS[@]} -eq 0 ]; then
            echo "NO_CHANGES=true" >> "${GITHUB_ENV}"
            exit 0
          fi

          # Paths that 7.x "owns" and should NOT be overridden by 6.x syncs.
          # Start conservative; expand as you learn which ones regularly conflict.
          OWNED_PATHS_REGEX='^(images/ci-builder/Dockerfile|images/php/Dockerfile\.fpm|images/php/Dockerfile\.cli|images/awx-ee/execution-environment\.yml)$'

          HAD_SKIPS=false
          APPLIED_ANY=false

          for entry in "${COMMITS[@]}"; do
            sha="${entry%% *}"
            subj="${entry#* }"

            echo "==> Cherry-picking ${sha}: ${subj}"

            # Try to cherry-pick without committing so we can fix paths before finalizing
            if ! git cherry-pick -n "${sha}"; then
              echo "Conflict detected; attempting auto-resolution for owned paths..."

              # List conflicted files
              mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U || true)

              if [ ${#CONFLICTS[@]} -gt 0 ]; then
                # For owned/conflict-prone files, keep 7.x (current branch) version
                for f in "${CONFLICTS[@]}"; do
                  if [[ "$f" =~ $OWNED_PATHS_REGEX ]]; then
                    echo "Keeping 7.x version for: $f"
                    git restore --source=HEAD -- "$f" || true
                  fi
                done
                git add -A || true
              fi

              # Try to continue after auto-fix. If it still fails, skip this commit.
              if ! git -c core.editor=true cherry-pick --continue; then
                echo "Unable to auto-resolve ${sha}; skipping."
                HAD_SKIPS=true
                git cherry-pick --abort
                continue
              fi
            fi

            # Even when no conflict occurred, ensure owned files stay as 7.x
            TO_RESTORE="$(git diff --name-only --cached | grep -E "$OWNED_PATHS_REGEX" || true)"
            if [ -n "$TO_RESTORE" ]; then
              git restore --source=HEAD -- $TO_RESTORE || true
              git add -A || true
            fi

            # Finalize the cherry-pick commit (re-use picked message)
            if git commit --no-edit; then
              APPLIED_ANY=true
            else
              # If nothing to commit (e.g., all changes reverted), clean up and move on
              git reset --hard
            fi
          done

          # If nothing actually changed vs origin/7.x, don't open a PR
          if ! $APPLIED_ANY || git diff --quiet origin/7.x..HEAD; then
            echo "NO_CHANGES=true" >> "${GITHUB_ENV}"
          fi

          # Surface whether we had skips (optional – for PR labelling/message)
          if $HAD_SKIPS; then
            echo "HAD_SKIPS=true" >> "${GITHUB_ENV}"
          fi

      - name: Create a pull request from sync branch to 7.x
        if: env.NO_CHANGES != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: 7.x
          branch: temp-sync-branch
          title: "Sync changes from 6.x"
          body: |
            This pull request syncs relevant changes from the `6.x` branch into the `7.x` branch.

            - Commits with `sync: skip` in their message were excluded automatically.
            - If a commit conflicted only in known 7.x-owned files (Dockerfiles or AWX EE defs), those files were kept from `7.x`.
            - Commits that still could not be auto-resolved were skipped (if any, the label below will be present).

            This PR was automatically generated by the CI workflow.
          labels: ${{ env.HAD_SKIPS == 'true' && 'sync, automated, sync-skipped-commits' || 'sync, automated' }}
          draft: false
          sign-commits: true

      - name: Enable auto-merge
        if: env.NO_CHANGES != 'true'
        run: |
          gh pr merge temp-sync-branch --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
