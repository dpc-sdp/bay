name: Merge 6.x into 7.x

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 23 * * 0'  # Run every Sunday at 11 PM UTC (Monday 9 AM AEST)

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: 6.x

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR
        id: create-pr
        run: |
          gh pr create --base 7.x --title "Automated PR - merge 6.x into 7.x" --body "This pull request syncs relevant changes from the `6.x` branch into the `7.x` branch.\nThis PR was automatically generated by the CI workflow." --label "sync" --label "automated"
          // Check response, if "No commits between 7.x and 7.x" add step summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Slack notification if pr created but conflicts exist

      - name: Send Slack notification if pr creation failed for a reason other than "no commits"
        id: notify_slack
        uses: slackapi/slack-github-action@v2.1.1
        if: steps.create-pr.outputs.exitcode > 0 //change this to an env var check
        env:
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.event.repository.html_url }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SDP_PLATFORM_SLACK_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "GitHub Action - ${{ github.action }} failed. \n${{ env.LINK }}"