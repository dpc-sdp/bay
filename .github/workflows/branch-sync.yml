name: Merge 6.x into 7.x

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 23 * * 0'  # Run every Sunday at 11 PM UTC (Monday 9 AM AEST)
  push:
    branches:
      - 'feature/6.x-7.x-sync'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare sync branch
        run: |
          # Fetch all branches
          git fetch origin

          # Create a new sync branch from 7.x (target)
          git checkout -b temp-sync-branch origin/7.x

          # Find all 6.x commits not on 7.x and cherry-pick them
          COMMITS=$(git log --reverse --pretty=format:"%H" origin/7.x..origin/6.x)
          if [ -z "$COMMITS" ]; then
            echo "NO_CHANGES=true" >> "${GITHUB_ENV}"
            exit 0
          fi

          for commit in $COMMITS; do
            git cherry-pick $commit || { echo "Cherry-pick failed"; exit 1; }
          done

          git push origin temp-sync-branch --force

      - name: Check for conflicts
        if: env.NO_CHANGES != 'true'
        id: check_conflicts
        run: |
          # Test if this would create conflicts with 7.x
          if git diff --check; then
            echo "has_conflicts=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_conflicts=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create a pull request from sync branch to 7.x
        if: env.NO_CHANGES != 'true' && steps.check_conflicts.outputs.has_conflicts == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: 7.x
          branch: temp-sync-branch
          title: "Sync changes from 6.x"
          body: |
            This pull request syncs relevant changes from the `6.x` branch into the `7.x` branch.
            
            This PR was automatically generated by the CI workflow.
          labels: sync, automated
          draft: false
          sign-commits: true

      - name: Enable auto-merge
        if: env.NO_CHANGES != 'true' && steps.check_conflicts.outputs.has_conflicts == 'false'
        run: |
          gh pr merge temp-sync-branch --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify about conflicts
        if: env.NO_CHANGES != 'true' && steps.check_conflicts.outputs.has_conflicts == 'true'
        run: |
          echo "::warning::Potential conflicts detected when syncing changes from 6.x to 7.x. Manual intervention required."