name: build-lagoon-php
run-name: Build Lagoon PHP ${{ inputs.php_version }} base images (lagoon-images@${{ inputs.lagoon_ref }})

# Emergency path for PHP security releases. Rebuilds the upstream Lagoon PHP
# images from uselagoon/lagoon-images with the official php base image bumped
# to the requested patch version, and publishes them to
# ghcr.io/dpc-sdp/bay/lagoon/php-<minor>-{fpm,cli-drupal}:<php_version>.
#
# Bay php-fpm / php-cli are then built on top of them by setting
# LAGOON_BASE_REPO / LAGOON_BASE_TAG in gh-actions-bake.hcl.

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP patch version to build, e.g. 8.3.36. The php:<version>-fpm-alpine<x.y> tag must already exist on Docker Hub.
        required: true
        type: string
      lagoon_ref:
        description: uselagoon/lagoon-images git ref (release tag recommended) to build from.
        required: true
        default: "26.9.0"
        type: string
      platforms:
        description: Target platforms.
        required: true
        default: linux/amd64,linux/arm64
        type: string

env:
  REGISTRY: ghcr.io
  PUSH_REPO: ghcr.io/${{ github.repository }}/lagoon

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Validate inputs
        id: vars
        env:
          PHP_VERSION: ${{ inputs.php_version }}
        run: |
          if ! [[ "$PHP_VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::error::php_version must look like 8.3.36, got '$PHP_VERSION'"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          {
            echo "minor=${major}.${minor}"
            echo "target_suffix=${major}-${minor}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: uselagoon/lagoon-images
          ref: ${{ inputs.lagoon_ref }}
          path: lagoon-images

      - name: Bump php base image
        id: bump
        working-directory: lagoon-images
        env:
          PHP_VERSION: ${{ inputs.php_version }}
          DOCKERFILE: images/php-fpm/${{ steps.vars.outputs.minor }}.Dockerfile
        run: |
          current="$(grep -E '^FROM php:[0-9.]+-fpm-alpine[0-9.]+$' "$DOCKERFILE")"
          if [ "$(echo "$current" | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one 'FROM php:<x.y.z>-fpm-alpine<a.b>' line in $DOCKERFILE"
            exit 1
          fi
          alpine="${current##*-fpm-alpine}"
          base="php:${PHP_VERSION}-fpm-alpine${alpine}"
          echo "Current: $current"
          echo "New:     FROM $base"
          sed -i -E "s|^FROM php:[0-9.]+-fpm-alpine[0-9.]+$|FROM ${base}|" "$DOCKERFILE"
          git diff
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Check upstream php image exists
        env:
          BASE: ${{ steps.bump.outputs.base }}
        run: docker buildx imagetools inspect "docker.io/library/${BASE}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build amd64 for smoke test
        working-directory: lagoon-images
        env:
          PLATFORMS: linux/amd64
          PUSH_TAG: ${{ inputs.php_version }}
          LAGOON_VERSION: ${{ inputs.lagoon_ref }}
          TARGETS: php-${{ steps.vars.outputs.target_suffix }}-fpm php-${{ steps.vars.outputs.target_suffix }}-cli-drupal
        run: |
          # shellcheck disable=SC2086 # TARGETS is a space separated list
          docker buildx bake -f docker-bake.hcl --load $TARGETS

      - name: Smoke test
        env:
          PHP_VERSION: ${{ inputs.php_version }}
          MINOR: ${{ steps.vars.outputs.minor }}
        run: |
          set -euo pipefail
          required="apcu bcmath brotli exif gd gettext imagick intl mysqli opcache pdo_mysql pdo_pgsql redis soap sockets tidy xsl yaml zip"
          for variant in fpm cli-drupal; do
            image="${PUSH_REPO}/php-${MINOR}-${variant}:${PHP_VERSION}"
            echo "::group::$image"
            actual="$(docker run --rm --entrypoint php "$image" -r 'echo PHP_VERSION;')"
            if [ "$actual" != "$PHP_VERSION" ]; then
              echo "::error::$image reports PHP $actual, expected $PHP_VERSION"
              exit 1
            fi
            modules="$(docker run --rm --entrypoint php "$image" -m | tr '[:upper:]' '[:lower:]')"
            for ext in $required; do
              grep -qx "$ext" <<<"$modules" || grep -qx "zend $ext" <<<"$modules" || { echo "::error::$image is missing extension $ext"; exit 1; }
            done
            if docker run --rm --entrypoint php "$image" -v 2>&1 | grep -iE 'warning|unable to load'; then
              echo "::error::$image emits warnings on startup"
              exit 1
            fi
            echo "::endgroup::"
          done

      # Guard against the rebuild silently dropping anything Lagoon layers on
      # top of the official php image (extensions, ini/fpm config, entrypoints,
      # tools, OS packages). Package versions are ignored: Lagoon does not pin
      # apk packages, so a rebuild picks up newer Alpine security updates.
      - name: Compare with upstream Lagoon release
        env:
          PHP_VERSION: ${{ inputs.php_version }}
          MINOR: ${{ steps.vars.outputs.minor }}
          LAGOON_REF: ${{ inputs.lagoon_ref }}
        run: |
          set -euo pipefail
          inventory() {
            docker image inspect "$1" --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}} {{.Config.WorkingDir}} {{json .Config.ExposedPorts}}'
            docker image inspect "$1" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -vE '^(PHP_VERSION|PHP_SHA256|PHP_URL|PHP_ASC_URL)=' | sort
            # shellcheck disable=SC2016 # expanded inside the container
            docker run --rm --entrypoint sh "$1" -c '
              php -m
              ls /usr/local/etc/php/conf.d /usr/local/etc/php-fpm.d "$(php -r "echo ini_get(\"extension_dir\");")"
              ls /usr/local/bin /usr/local/sbin /bin /sbin
              find /lagoon /home -maxdepth 3 -not -path "/home/.pie/*" | sort
              apk info | sort
            '
          }
          for variant in fpm cli-drupal; do
            upstream="docker.io/uselagoon/php-${MINOR}-${variant}:${LAGOON_REF}"
            rebuilt="${PUSH_REPO}/php-${MINOR}-${variant}:${PHP_VERSION}"
            if ! docker pull -q --platform linux/amd64 "$upstream"; then
              echo "::warning::$upstream not published (lagoon_ref is not a release tag?), skipping comparison"
              continue
            fi
            echo "::group::$upstream vs $rebuilt"
            if ! diff <(inventory "$upstream") <(inventory "$rebuilt"); then
              echo "::error::$rebuilt differs from $upstream beyond the PHP version"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Build and push all platforms
        working-directory: lagoon-images
        env:
          PLATFORMS: ${{ inputs.platforms }}
          PUSH_TAG: ${{ inputs.php_version }}
          PUSH_TAG_ADDITIONAL: ${{ inputs.php_version }}-lagoon-${{ inputs.lagoon_ref }}
          LAGOON_VERSION: ${{ inputs.lagoon_ref }}
          TARGETS: php-${{ steps.vars.outputs.target_suffix }}-fpm php-${{ steps.vars.outputs.target_suffix }}-cli-drupal
        run: |
          # shellcheck disable=SC2086 # TARGETS is a space separated list
          docker buildx bake -f docker-bake.hcl --push $TARGETS

      - name: Summary
        env:
          PHP_VERSION: ${{ inputs.php_version }}
          MINOR: ${{ steps.vars.outputs.minor }}
          LAGOON_REF: ${{ inputs.lagoon_ref }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Lagoon PHP ${PHP_VERSION} images published

          Built from \`uselagoon/lagoon-images@${LAGOON_REF}\` with the php base bumped to \`${PHP_VERSION}\`.

          - \`${PUSH_REPO}/php-${MINOR}-fpm:${PHP_VERSION}\`
          - \`${PUSH_REPO}/php-${MINOR}-cli-drupal:${PHP_VERSION}\`

          To build Bay php-fpm / php-cli on these, set in \`gh-actions-bake.hcl\`:

          \`\`\`hcl
          variable "LAGOON_BASE_REPO" { default = "${PUSH_REPO}" }
          variable "LAGOON_BASE_TAG"  { default = "${PHP_VERSION}" }
          \`\`\`
          EOF
