#
# Block the Drupal installer.
#
# The base image routes /install.php and /core/install.php straight to PHP-FPM.
# Sites are provisioned with Drush, so the installer should never be reachable
# (see SA-CORE-2026-017). Included at the top of the server block so it is
# matched before the base image's install location.
#
location ~* ^/(core/)?install\.php {
  access_log off;
  return 404;
}
